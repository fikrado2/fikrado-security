name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # ─── WINDOWS ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
          if (!(Test-Path assets/logo.ico)) {
              pip install pillow
              python -c "from PIL import Image; img = Image.open('assets/logo.png').convert('RGBA'); img.save('assets/logo.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          }

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm FikradoSecurity.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/FikradoSecurity.exe
          compression-level: 0

  # ─── LINUX ─────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux Qt deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libegl1 libopengl0 libdbus-1-3 libgl1 libxkbcommon-x11-0

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm FikradoSecurity.spec

      - name: Create Linux archive
        run: |
          # Package as tar.gz (no FUSE, works on all distros)
          cp assets/fikrado-security.desktop dist/
          cp assets/logo.png dist/
          tar -czvf Fikrado-Security-Linux.tar.gz -C dist .
          ls -lh Fikrado-Security-Linux.tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: Fikrado-Security-Linux.tar.gz
          compression-level: 0

  # ─── MACOS ─────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm FikradoSecurity.spec

      - name: Create .app bundle and DMG
        run: |
          BUNDLE="/tmp/Fikrado Security.app"
          CONTENTS="$BUNDLE/Contents"
          mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"
          cp dist/FikradoSecurity "$CONTENTS/MacOS/FikradoSecurity"
          chmod +x "$CONTENTS/MacOS/FikradoSecurity"
          cat > "$CONTENTS/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>FikradoSecurity</string>
            <key>CFBundleIdentifier</key><string>com.fikrado.security</string>
            <key>CFBundleName</key><string>Fikrado Security</string>
            <key>CFBundleDisplayName</key><string>Fikrado Security</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.6.89</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict></plist>
          PLIST
          # Copy icon
          cp assets/logo.png "$CONTENTS/Resources/AppIcon.png" 2>/dev/null || true
          # Create DMG
          hdiutil create \
            -volname "Fikrado Security" \
            -srcfolder "$BUNDLE" \
            -ov -format UDZO \
            -imagekey zlib-level=9 \
            /tmp/Fikrado-Security.dmg
          cp /tmp/Fikrado-Security.dmg Fikrado-Security.dmg
          ls -lh Fikrado-Security.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Fikrado-Security.dmg
          compression-level: 0

  # ─── CREATE RELEASE ────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | while read f; do echo "$(du -h "$f" | cut -f1)  $f"; done

      - name: Create GitHub Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: false
          prerelease: false
          body: |
            ## Fikrado Security - Cross-Platform Release

            Prebuilt binaries for **Windows**, **Linux**, and **macOS**.

            ### Downloads
            - **`FikradoSecurity.exe`** – Windows x64 (run as Administrator)
            - **`Fikrado-Security-Linux.tar.gz`** – Linux portable bundle (`tar -xzvf Fikrado-Security-Linux.tar.gz && ./FikradoSecurity`)
            - **`Fikrado-Security.dmg`** – macOS DMG (drag to Applications; **right-click → Open** on first launch to bypass Gatekeeper)

            ### Build
            - Built by GitHub Actions CI · Python 3.11 · PySide6 · PyInstaller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
