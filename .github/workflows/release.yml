name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # ─── WINDOWS ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Generate .ico if missing
        run: |
          if (!(Test-Path assets/logo.ico)) {
            pip install pillow
            python -c "from PIL import Image; img = Image.open('assets/logo.png').convert('RGBA'); img.save('assets/logo.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          }

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm FikradoSecurity.spec

      - name: Verify output
        run: ls dist/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/FikradoSecurity.exe
          compression-level: 0

  # ─── LINUX ─────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libopengl0 \
            libdbus-1-3 libgl1 libxcb-icccm4 libxkbcommon-x11-0

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Install AppImage tooling
        run: |
          pip install appimage-builder
          # Download appimagetool as fallback
          curl -sL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm FikradoSecurity.spec

      - name: Package AppImage
        run: |
          # Create AppDir structure
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons
          # Copy binary
          cp dist/FikradoSecurity AppDir/usr/bin/
          # Copy assets
          cp -r assets AppDir/usr/share/fikrado-assets
          # Copy desktop file
          cp assets/fikrado-security.desktop AppDir/usr/share/applications/
          # Create icon
          cp assets/logo.png AppDir/fikrado-security.png
          ln -sf /usr/share/icons/hicolor/256x256/apps/fikrado-security.png AppDir/fikrado-security.png 2>/dev/null || true
          # Create AppRun
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          export APPDIR="$(dirname "$(readlink -f "${0}")")"
          exec "$APPDIR/usr/bin/FikradoSecurity" "$@"
          APPRUN
          chmod +x AppDir/AppRun
          # Build AppImage using AppImageKit
          /tmp/appimagetool.AppImage AppDir Fikrado-Security.AppImage
          ls -lh Fikrado-Security.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: Fikrado-Security.AppImage
          compression-level: 0

  # ─── MACOS ─────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
          brew install create-dmg

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm FikradoSecurity.spec

      - name: Verify bundle
        run: ls -la dist/

      - name: Create DMG
        run: |
          # Rename bundle for display
          cp -r dist/FikradoSecurity.app "/tmp/Fikrado Security.app"
          create-dmg \
            --volname "Fikrado Security" \
            --volicon "assets/logo.png" \
            --window-pos 200 120 \
            --icon-size 100 \
            --icon "Fikrado Security" 150 185 \
            --app-drop-link 400 185 \
            --hide-extension "Fikrado Security.app" \
            "/tmp/Fikrado-Security.dmg" \
            "/tmp/Fikrado Security.app"
          mv /tmp/Fikrado-Security.dmg Fikrado-Security.dmg
          ls -lh Fikrado-Security.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Fikrado-Security.dmg
          compression-level: 0

  # ─── CREATE RELEASE ────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: false
          prerelease: false
          body: |
            ## Fikrado Security - Cross-Platform Release

            This release includes prebuilt binaries for **Windows**, **Linux**, and **macOS**.

            ### Downloads
            - `FikradoSecurity.exe` – Windows x64 (run as Administrator)
            - `Fikrado-Security.AppImage` – Linux AppImage (run: `chmod +x Fikrado-Security.AppImage && ./Fikrado-Security.AppImage`)
            - `Fikrado-Security.dmg` – macOS DMG (drag to Applications; right-click → Open on first launch)

            ### Build info
            - Version: auto-tagged from `v*` push
            - Built by GitHub Actions CI
            - Python 3.11 + PySide6 + PyInstaller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
