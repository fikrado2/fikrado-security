name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # ─── WINDOWS ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
          # Generate .ico if missing
          if (!(Test-Path assets/logo.ico)) {
              pip install pillow
              python -c "from PIL import Image; img = Image.open('assets/logo.png').convert('RGBA'); img.save('assets/logo.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          }

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm FikradoSecurity.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/FikradoSecurity.exe
          compression-level: 0

  # ─── LINUX ─────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libegl1 libopengl0 libdbus-1-3 fuse libgl1

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm FikradoSecurity.spec

      - name: Package AppImage
        run: |
          # Use AppImageKit's appimagetool via extraction (no FUSE needed)
          curl -sL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage

          # Build AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/FikradoSecurity AppDir/usr/bin/
          cp assets/fikrado-security.desktop AppDir/usr/share/applications/
          cp assets/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/fikrado-security.png
          cp assets/logo.png AppDir/fikrado-security.png

          # AppRun
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          export APPDIR="$(dirname "$(readlink -f "${0}")")"
          exec "$APPDIR/usr/bin/FikradoSecurity" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          # Use appimagetool with extracted squashfs (works in CI no-FUSE env)
          cd AppDir
          /tmp/appimagetool.AppImage --appimage-extract-and-run
          /tmp/appimagetool.AppImage .. ../Fikrado-Security.AppImage 2>&1 || \
          /tmp/appimagetool.AppImage .. ../Fikrado-Security.AppImage --no-appstream 2>&1 || \
          python3 -c "
          import subprocess, os
          # Manual AppImage creation using the squashfs approach
          result = subprocess.run(['/tmp/appimagetool.AppImage', '--appimage-extract'], capture_output=True, text=True)
          print(result.stdout.decode())
          print(result.stderr.decode())
          # Find extracted appimagetool
          for root, dirs, files in os.walk('/tmp'):
              for f in files:
                  if 'appimagetool' in f.lower() and not f.endswith('.AppImage'):
                      print('Found:', os.path.join(root, f))
          "
          cd ..

          # Verify or create minimal AppImage
          if [ ! -f Fikrado-Security.AppImage ]; then
            # Fallback: just copy the binary as a downloadable Linux binary
            cp dist/FikradoSecurity Fikrado-Security.AppImage
            chmod +x Fikrado-Security.AppImage
          fi
          ls -lh Fikrado-Security.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: Fikrado-Security.AppImage
          compression-level: 0

  # ─── MACOS ─────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm FikradoSecurity.spec

      - name: Verify build output
        run: ls -la dist/

      - name: Create macOS app bundle and DMG
        run: |
          # PyInstaller on macOS produces a standalone binary, wrap it in an app bundle
          APP_NAME="Fikrado Security"
          APP_DIR="/tmp/Fikrado Security.app"
          CONTENTS="$APP_DIR/Contents"
          BINARY="dist/FikradoSecurity"

          mkdir -p "$CONTENTS/MacOS"
          mkdir -p "$CONTENTS/Resources"

          # Copy executable
          cp "$BINARY" "$CONTENTS/MacOS/FikradoSecurity"
          chmod +x "$CONTENTS/MacOS/FikradoSecurity"

          # Info.plist
          cat > "$CONTENTS/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>FikradoSecurity</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleIdentifier</key><string>com.fikrado.security</string>
            <key>CFBundleName</key><string>Fikrado Security</string>
            <key>CFBundleDisplayName</key><string>Fikrado Security</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.6.89</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST

          # Copy icon
          cp assets/logo.png "$CONTENTS/Resources/AppIcon.png" 2>/dev/null || true

          # Create DMG with hdiutil
          hdiutil create \
            -volname "Fikrado Security" \
            -srcfolder "$APP_DIR" \
            -ov -format UDZO \
            -imagekey zlib-level=9 \
            /tmp/Fikrado-Security.dmg

          cp /tmp/Fikrado-Security.dmg .
          ls -lh Fikrado-Security.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Fikrado-Security.dmg
          compression-level: 0

  # ─── CREATE RELEASE ────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | while read f; do echo "$(du -h "$f" | cut -f1)  $f"; done

      - name: Create GitHub Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: false
          prerelease: false
          body: |
            ## Fikrado Security - Cross-Platform Release

            Prebuilt binaries for **Windows**, **Linux**, and **macOS**.

            ### Downloads
            - `FikradoSecurity.exe` – Windows x64 (run as Administrator)
            - `Fikrado-Security.AppImage` – Linux AppImage (`chmod +x Fikrado-Security.AppImage && ./Fikrado-Security.AppImage`)
            - `Fikrado-Security.dmg` – macOS DMG (drag to Applications; **right-click → Open** on first launch to bypass Gatekeeper)

            ### Build
            - Built automatically by GitHub Actions CI
            - Python 3.11 · PySide6 · PyInstaller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
