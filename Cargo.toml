[package]
name = "fikrado-security"
version = "2.6.87"
edition = "2021"
authors = ["Fikrado Security", "Yahye Abdirahman"]
description = "Next-Generation Enterprise Windows Threat Defense Platform"

[[bin]]
name = "FikradoSecurity"
path = "src/main.rs"

[[bin]]
name = "FikradoSecuritySetup"
path = "src/installer.rs"

[[bin]]
name = "FikradoSecurityUninstall"
path = "src/uninstaller.rs"

[dependencies]
tao = "0.30"
wry = "0.47"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
sha2 = "0.10"
sha1 = "0.10"
walkdir = "2.5"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
